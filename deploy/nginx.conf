# Reached only through the Cloudflare tunnel: loopback, on its own port, so it can
# never answer for the other sites on this server.
limit_req_zone $binary_remote_addr zone=th_auth:1m rate=20r/m;
limit_req_zone $binary_remote_addr zone=th_api:1m rate=20r/s;

server {
    listen 127.0.0.1:8110;
    server_name twilight-hearth.net;
    server_tokens off;
    root /opt/twilight-hearth/current/frontend/dist;

    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    limit_req_status 429;
    client_max_body_size 2m;

    include /etc/nginx/snippets/twilight-hearth-headers.conf;

    location /api/ {
        limit_req zone=th_api burst=60 nodelay;
        include /etc/nginx/snippets/twilight-hearth-proxy.conf;
    }

    location /api/images {
        limit_req zone=th_api burst=60 nodelay;
        client_max_body_size 16m;
        include /etc/nginx/snippets/twilight-hearth-proxy.conf;
    }

    location /api/imports {
        limit_req zone=th_api burst=60 nodelay;
        client_max_body_size 16m;
        include /etc/nginx/snippets/twilight-hearth-proxy.conf;
    }

    # me and config are read on every page load, so only sign-in itself is strict.
    location ~ ^/api/auth/(google/|invite) {
        limit_req zone=th_auth burst=20 nodelay;
        access_log off;  # the callback address carries a sign-in code
        include /etc/nginx/snippets/twilight-hearth-proxy.conf;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/twilight-hearth-headers.conf;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/twilight-hearth-headers.conf;
    }
}
